<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Suraksha</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 25px 15px;
        }

        .register-container {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .heading {
            text-align: center;
            margin-bottom: 25px;
        }

        .heading h1 {
            color: #2b6cb0;
            margin-bottom: 8px;
        }

        .heading p {
            color: #666;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2b6cb0;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #2b6cb0;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1e4e8c;
        }

        .error {
            background: #fff0f0;
            color: #c53030;
            padding: 11px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }

        .login-link a {
            color: #2b6cb0;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="heading">
            <h1>Suraksha</h1>
            <p>Create your account to get started</p>
        </div>

        <div th:if="${error}" class="error" th:text="${error}"></div>

        <form th:action="@{/register}" method="post">

            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>

            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Choose a username" maxlength="80" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="joinCode">Institution Join Code</label>
            <input type="text" id="joinCode" name="joinCode" placeholder="Enter your institution code" maxlength="20"
                required>

            <label for="role">Register As</label>
            <select id="role" name="role" required>
                <option value="">Select your role</option>
                <option value="STUDENT">Student</option>
                <option value="TEACHER">Teacher</option>
            </select>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Create a password" required>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password"
                required>

            <button type="submit">Create Account</button>

        </form>

        <div class="login-link">
            Already have an account?
            <a th:href="@{/login}">Login here</a>
        </div>

    </div>

</body>

</html>
